<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login | OPDeasy</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body class="login-page">
    <main class="login-card">
        <div class="login-brand">
            <h1>OPDeasy</h1>
            <p>Hospital Queue Management System</p>
        </div>

        <form id="loginForm">
            <div class="form-group">
                <label for="loginName">DOCTOR's NAME</label>
                <input id="loginName" type="text" placeholder="Enter Docter's Name" required>
            </div>

            <button class="btn" type="submit">Enter Hospital System</button>
        </form>

        <p class="login-help">For authorised hospital staff and doctors only.</p>
    </main>
    <script src="app.js"></script>
</body>
</html>
