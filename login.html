<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login | OPDeasy</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body class="login-page">
    <main class="login-card">
        <div class="login-brand">
            <h1>OPDeasy</h1>
            <p>Hospital Queue Management System</p>
        </div>

        <div id="errorMessage" class="error-message"></div>

        <form id="loginForm">
            <div class="form-group">
                <label for="doctorName">DOCTOR'S NAME</label>
                <input id="doctorName" type="text" placeholder="Enter Doctor's Name" required>
            </div>

            <div class="form-group">
                <label for="email">EMAIL</label>
                <input id="email" type="email" placeholder="Enter Your Email" required>
            </div>

            <div class="form-group">
                <label for="password">PASSWORD</label>
                <input id="password" type="password" placeholder="Enter Your Password" required>
            </div>

            <div class="checkbox-group">
                <input id="rememberMe" type="checkbox">
                <label for="rememberMe">Remember me</label>
            </div>

            <button class="btn" type="submit">Enter Hospital System</button>
        </form>

        <div class="login-footer">
            <a href="#" id="forgotPassword" class="forgot-password-link">Forgot Password?</a>
        </div>

        <p class="login-help">For authorised hospital staff and doctors only.</p>
    </main>

    <!-- Forgot Password Modal -->
    <div id="forgotPasswordModal" class="modal">
        <div class="modal-content">
            <span class="close">&times;</span>
            <h2>Reset Password</h2>
            <p>Enter your email address and we'll send you a link to reset your password.</p>
            <div class="form-group">
                <label for="resetEmail">EMAIL</label>
                <input id="resetEmail" type="email" placeholder="Enter Your Email" required>
            </div>
            <div id="resetMessage" class="reset-message"></div>
            <button id="resetButton" class="btn" type="button">Send Reset Link</button>
        </div>
    </div>

    <!-- Firebase initialization -->
    <script type="module">
      import { initializeApp } from "https://www.gstatic.com/firebasejs/9.22.2/firebase-app.js";
      import { getAnalytics } from "https://www.gstatic.com/firebasejs/9.22.2/firebase-analytics.js";
      import { getAuth, signInWithEmailAndPassword, sendPasswordResetEmail, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/9.22.2/firebase-auth.js";
      import { getDatabase, ref, set } from "https://www.gstatic.com/firebasejs/9.22.2/firebase-database.js";

      const firebaseConfig = {
        apiKey: "AIzaSyDsyAcahXHAI14JcbLX6eyV7KAyWtx1Lno",
        authDomain: "opdeasy-57f8a.firebaseapp.com",
        projectId: "opdeasy-57f8a",
        storageBucket: "opdeasy-57f8a.firebasestorage.app",
        messagingSenderId: "817688179546",
        appId: "1:817688179546:web:0c67aa31606db95a983963",
        measurementId: "G-RCYDBC9JGD"
      };

      const app = initializeApp(firebaseConfig);
      const analytics = getAnalytics(app);

      // Expose firebase helper on window for non-module app.js
      const auth = getAuth(app);
      const db = getDatabase(app);
      window.firebase = {
        app,
        analytics,
        auth,
        db,
        signInWithEmailAndPassword,
        sendPasswordResetEmail,
        onAuthStateChanged,
        ref,
        set
      };
    </script>
    <script src="app.js"></script>
</body>
</html>
