<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login | OPDeasy</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body class="login-page">
    <main class="login-card">
        <div class="login-brand">
            <h1>OPDeasy</h1>
            <p>Hospital Queue Management System</p>
        </div>

        <div id="errorMessage" class="error-message"></div>

        <!-- Login Form (Initially Visible) -->
        <form id="loginForm" style="display: block;">
            <div class="form-group">
                <label for="doctorName">DOCTOR'S NAME</label>
                <input id="doctorName" type="text" placeholder="Enter Doctor's Name" required>
            </div>

            <div class="form-group">
                <label for="email">EMAIL</label>
                <input id="email" type="email" placeholder="Enter Your Email" required>
            </div>

            <div class="form-group">
                <label for="password">PASSWORD</label>
                <input id="password" type="password" placeholder="Enter Your Password" required>
            </div>

            <div class="checkbox-group">
                <input id="rememberMe" type="checkbox">
                <label for="rememberMe">Remember me</label>
            </div>

            <button class="btn" type="submit">Enter Hospital System</button>
        </form>

        <div class="login-footer">
            <a href="#" id="forgotPassword" class="forgot-password-link">Forgot Password?</a>
            <div style="margin-top: 12px; text-align: center; color: var(--muted); font-size: 14px;">
                Don't have an account? <a href="#" id="switchToRegister" class="forgot-password-link">Register here</a>
            </div>
        </div>

        <!-- Registration Form (Initially Hidden) -->
        <form id="registrationForm" style="display: none;">
            <div class="form-group">
                <label for="regDoctorName">DOCTOR'S NAME</label>
                <input id="regDoctorName" type="text" placeholder="Enter Full Name" required>
            </div>

            <div class="form-group">
                <label for="regEmail">EMAIL</label>
                <input id="regEmail" type="email" placeholder="Enter Email Address" required>
            </div>

            <div class="form-group">
                <label for="regPhone">PHONE NUMBER</label>
                <input id="regPhone" type="tel" placeholder="Enter Phone Number" required>
            </div>

            <div class="form-group">
                <label for="regSpecialization">SPECIALIZATION</label>
                <input id="regSpecialization" type="text" placeholder="e.g., Cardiology, Neurology" required>
            </div>

            <div class="form-group">
                <label for="regLicenseNumber">LICENSE NUMBER</label>
                <input id="regLicenseNumber" type="text" placeholder="Enter License Number" required>
            </div>

            <div class="form-group">
                <label for="regPassword">PASSWORD</label>
                <input id="regPassword" type="password" placeholder="Create Password (min 6 characters)" required minlength="6">
            </div>

            <div class="form-group">
                <label for="regConfirmPassword">CONFIRM PASSWORD</label>
                <input id="regConfirmPassword" type="password" placeholder="Confirm Password" required minlength="6">
            </div>

            <div class="checkbox-group">
                <input id="regAgreeTerms" type="checkbox" required>
                <label for="regAgreeTerms">I agree to the terms and conditions</label>
            </div>

            <button class="btn" type="submit">Create Account</button>
        </form>

        <div id="registrationFooter" style="display: none; text-align: center; margin-top: 12px; color: var(--muted); font-size: 14px;">
            Already have an account? <a href="#" id="switchToLogin" class="forgot-password-link">Login here</a>
        </div>

        <p class="login-help">For authorised hospital staff and doctors only.</p>
    </main>

    <!-- Forgot Password Modal -->
    <div id="forgotPasswordModal" class="modal">
        <div class="modal-content">
            <span class="close">&times;</span>
            <h2>Reset Password</h2>
            <p>Enter your email address and we'll send you a link to reset your password.</p>
            <div class="form-group">
                <label for="resetEmail">EMAIL</label>
                <input id="resetEmail" type="email" placeholder="Enter Your Email" required>
            </div>
            <div id="resetMessage" class="reset-message"></div>
            <button id="resetButton" class="btn" type="button">Send Reset Link</button>
        </div>
    </div>

    <!-- Firebase initialization -->
    <script type="module">
      import { initializeApp } from "https://www.gstatic.com/firebasejs/9.22.2/firebase-app.js";
      import { getAnalytics } from "https://www.gstatic.com/firebasejs/9.22.2/firebase-analytics.js";
      import { getAuth, signInWithEmailAndPassword, createUserWithEmailAndPassword, sendPasswordResetEmail, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/9.22.2/firebase-auth.js";
      import { getDatabase, ref, set, get } from "https://www.gstatic.com/firebasejs/9.22.2/firebase-database.js";

      const firebaseConfig = {
        apiKey: "AIzaSyDsyAcahXHAI14JcbLX6eyV7KAyWtx1Lno",
        authDomain: "opdeasy-57f8a.firebaseapp.com",
        projectId: "opdeasy-57f8a",
        storageBucket: "opdeasy-57f8a.firebasestorage.app",
        messagingSenderId: "817688179546",
        appId: "1:817688179546:web:0c67aa31606db95a983963",
        measurementId: "G-RCYDBC9JGD"
      };

      const app = initializeApp(firebaseConfig);
      const analytics = getAnalytics(app);

      // Expose firebase helper on window for non-module app.js
      const auth = getAuth(app);
      const db = getDatabase(app);
      window.firebase = {
        app,
        analytics,
        auth,
        db,
        signInWithEmailAndPassword,
        createUserWithEmailAndPassword,
        sendPasswordResetEmail,
        onAuthStateChanged,
        ref,
        set,
        get
      };
    </script>
    <script src="app.js"></script>
</body>
</html>
