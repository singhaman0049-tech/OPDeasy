<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Register | OPDeasy</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body class="login-page">
    <main class="login-card">
        <div class="login-brand">
            <h1>OPDeasy</h1>
            <p>Hospital Queue Management System</p>
        </div>

        <div id="errorMessage" class="error-message"></div>

        <!-- Doctor Registration Form -->
        <form id="doctorRegistrationForm">
            <h2 style="text-align: center; color: var(--ink); margin-bottom: 20px; font-size: 22px;">Create Account</h2>

            <div class="form-group">
                <label for="regDoctorName">DOCTOR'S NAME</label>
                <input id="regDoctorName" type="text" placeholder="Enter Full Name" required>
            </div>

            <div class="form-group">
                <label for="regEmail">EMAIL</label>
                <input id="regEmail" type="email" placeholder="Enter Email Address" required>
            </div>

            <div class="form-group">
                <label for="regPhone">PHONE NUMBER</label>
                <input id="regPhone" type="tel" placeholder="Enter Phone Number" required>
            </div>

            <div class="form-group">
                <label for="regSpecialization">SPECIALIZATION</label>
                <input id="regSpecialization" type="text" placeholder="e.g., Cardiology, Neurology" required>
            </div>

            <div class="form-group">
                <label for="regLicenseNumber">LICENSE NUMBER</label>
                <input id="regLicenseNumber" type="text" placeholder="Enter License Number" required>
            </div>

            <div class="form-group">
                <label for="regPassword">PASSWORD</label>
                <input id="regPassword" type="password" placeholder="Create Password (min 6 characters)" required minlength="6">
            </div>

            <div class="form-group">
                <label for="regConfirmPassword">CONFIRM PASSWORD</label>
                <input id="regConfirmPassword" type="password" placeholder="Confirm Password" required minlength="6">
            </div>

            <div class="checkbox-group">
                <input id="regAgreeTerms" type="checkbox" required>
                <label for="regAgreeTerms">I agree to the terms and conditions</label>
            </div>

            <button class="btn" type="submit">Create Account</button>
        </form>

        <div class="login-footer">
            <div style="text-align: center; margin-top: 16px; color: var(--muted); font-size: 14px;">
                Already have an account? <a href="login.html" class="forgot-password-link">Login here</a>
            </div>
        </div>

        <p class="login-help">For authorised hospital staff and doctors only.</p>
    </main>

    <!-- Firebase initialization -->
    <script type="module">
      import { initializeApp } from "https://www.gstatic.com/firebasejs/9.22.2/firebase-app.js";
      import { getAnalytics } from "https://www.gstatic.com/firebasejs/9.22.2/firebase-analytics.js";
      import { getAuth, createUserWithEmailAndPassword } from "https://www.gstatic.com/firebasejs/9.22.2/firebase-auth.js";
      import { getDatabase, ref, set } from "https://www.gstatic.com/firebasejs/9.22.2/firebase-database.js";

      const firebaseConfig = {
        apiKey: "AIzaSyDsyAcahXHAI14JcbLX6eyV7KAyWtx1Lno",
        authDomain: "opdeasy-57f8a.firebaseapp.com",
        projectId: "opdeasy-57f8a",
        storageBucket: "opdeasy-57f8a.firebasestorage.app",
        messagingSenderId: "817688179546",
        appId: "1:817688179546:web:0c67aa31606db95a983963",
        measurementId: "G-RCYDBC9JGD"
      };

      const app = initializeApp(firebaseConfig);
      const analytics = getAnalytics(app);

      const auth = getAuth(app);
      const db = getDatabase(app);
      window.firebase = {
        app,
        analytics,
        auth,
        db,
        createUserWithEmailAndPassword,
        ref,
        set
      };
    </script>
   <script type="module" src="firebase-client.js"></script>
<script src="registration.js"></script>
</body>
</html>
